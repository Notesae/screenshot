name: Verify Windows framework
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: screenshot-verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    uses: ./.github/workflows/native-rebuild.yml
  verify:
    needs: native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: Screenshot-native-source-evidence
          path: artifacts/native-runtime/win-x64/
      - name: Prepare pinned local OCR models explicitly
        shell: pwsh
        run: ./scripts/prepare-ocr-models.ps1
      - name: Build and automated checks with synthetic OCR inference
        shell: pwsh
        run: ./scripts/verify.ps1 -WithOcrIntegration
      - name: Compare source and vendor native runtime on synthetic CPU OCR
        shell: pwsh
        run: ./scripts/native-quality.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshot-native-quality-evidence
          path: artifacts/qa/native-rebuild/
          if-no-files-found: warn
          retention-days: 14
      - name: Synthetic headless editor regressions
        shell: pwsh
        run: |
          npm install --prefix artifacts/headless-tools --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          $env:PLAYWRIGHT_MODULE = (Resolve-Path artifacts/headless-tools/node_modules/playwright).Path
          node editor/scripts/headless-overlay.cjs
          if ($LASTEXITCODE) { throw 'Headless overlay regressions failed.' }
          node editor/scripts/update-safety-audit.cjs artifacts/qa/product/update-safety.json
          if ($LASTEXITCODE) { throw 'Update snapshot regressions failed.' }
      - name: Product state and layout regressions on synthetic content
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_MODULE = (Resolve-Path artifacts/headless-tools/node_modules/playwright).Path
          node editor/scripts/product-audit.cjs artifacts/qa/product/current --verify
          node editor/scripts/refinement-audit.cjs artifacts/qa/product/refinement --verify
          node editor/scripts/product-performance.cjs artifacts/qa/product/performance.json --verify
          node editor/scripts/delivery-audit.cjs artifacts/qa/product/delivery --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshot-product-evidence
          path: artifacts/qa/product/
          if-no-files-found: warn
          retention-days: 14
      - name: Isolated storage crash recovery and synthetic image benchmarks
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_MODULE = (Resolve-Path artifacts/headless-tools/node_modules/playwright).Path
          ./scripts/quality.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Screenshot-quality-evidence
          path: artifacts/qa/quality/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Screenshot-headless-evidence
          path: editor/output/
          if-no-files-found: error
          retention-days: 14
      - name: Publish portable Windows x64 directory
        shell: pwsh
        run: ./scripts/publish.ps1 -SkipRestore
      - name: Verify packaged consent catalog with the native policy (no application launch)
        shell: pwsh
        run: |
          dotnet artifacts/verify-source/bin/Screenshot.App.Tests/release/Screenshot.App.Tests.dll --terms-package artifacts/Screenshot-win-x64
          if ($LASTEXITCODE) { throw 'Native packaged terms verification failed.' }
          $version = (Get-Content editor/package.json -Raw | ConvertFrom-Json).version
          dotnet artifacts/verify-source/bin/Screenshot.App.Tests/release/Screenshot.App.Tests.dll --update-package artifacts/Screenshot-win-x64 $version
          if ($LASTEXITCODE) { throw 'Native packaged update inventory verification failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Screenshot-win-x64
          path: artifacts/Screenshot-win-x64/
          if-no-files-found: error
          retention-days: 14
