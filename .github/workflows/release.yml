name: Publish verified prerelease
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: screenshot-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish only the exact successful main CI archive and verify downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-prerelease.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshot-release-verification
          path: |
            artifacts/release-verification/published-verification.json
            artifacts/release-verification/publication-state.json
            artifacts/release-verification/release-manifest.json
            artifacts/release-verification/RELEASE-NOTES.zh-CN.md
            artifacts/release-verification/SHA256SUMS.txt
            artifacts/release-verification/*.sha256
          if-no-files-found: warn
          retention-days: 30
