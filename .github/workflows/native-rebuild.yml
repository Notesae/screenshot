name: Rebuild minimal OCR native runtime
on:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned portable native build tools
        shell: pwsh
        run: |
          ./scripts/prepare-native-tools.ps1
          (Get-Command cmake.exe).Source | Split-Path | Out-File -FilePath $env:GITHUB_PATH -Append
          (Get-Command ninja.exe).Source | Split-Path | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build pinned minimal OpenCV and OpenCvSharp
        shell: pwsh
        run: ./scripts/build-native.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshot-native-source-evidence
          path: artifacts/native-runtime/win-x64/
          if-no-files-found: error
          retention-days: 14
